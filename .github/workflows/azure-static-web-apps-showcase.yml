name: Deploy showcase to Azure Static Web Apps

# The SECOND deploy route — the showcase artifact (the demo gallery + teleport
# receiver) to its own Static Web App resource at https://fuaran-ui.gallery.
# The playground artifact deploys to fuaran-ui.live via the sibling workflow
# (azure-static-web-apps.yml); the two origins are deliberately separate so the
# showcase's zero-key-egress CSP is inspectable per origin.
#
# Same posture as the playground workflow: we build ourselves with pnpm
# (skip_app_build: true) because Oryx does not understand the strict-CSP Vite
# plugin — the SWA action just uploads the already-built dist-showcase/.
#
# REQUIRED SECRET: AZURE_STATIC_WEB_APPS_API_TOKEN_SHOWCASE — the deployment
# token from the SHOWCASE Static Web App resource (Portal → the resource →
# Manage deployment token, or `az staticwebapp secrets list`). Distinct from
# the playground resource's token.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: azure-swa-showcase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    # Skip on a closed PR (that path only tears down the preview environment).
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    defaults:
      run:
        working-directory: fuaran-live
    steps:
      - uses: actions/checkout@v4
        with:
          path: fuaran-live

      # Sibling checkouts (public repos, no token): the Fable app
      # project-references ../fuaran-dotnet; the corpus sits at ../wire-format-fixtures.
      - uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-dotnet
          path: fuaran-dotnet

      - uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-specification
          path: wire-format-fixtures

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # NuGet hard-errors (NU1301) on the F# tier's missing local folder feed;
      # mint it empty — Fuaran.Core.* restores from nuget.org.
      - name: Create empty local-nuget-feed
        run: mkdir -p "$GITHUB_WORKSPACE/../../local-nuget-feed"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore .NET tools (Fable)
        run: dotnet tool restore

      # The showcase's conformance panel renders a PUBLISHED artefact, not a
      # hand-written badge: this step runs the projection-conformance gate and
      # writes public/conformance/report.generated.json, which the build below
      # copies into dist-showcase/. Without it the panel finds no file and shows
      # its honest grey "no report has been published for this deploy yet" state.
      #
      # It runs BEFORE the build (Vite copies public/ at build time) and fails
      # the deploy when the gate fails — a broken gate must not ship. The Fable
      # compile is invoked here because the harness executes the projector from
      # app/output/; the build step below reuses the same cached emission.
      - name: Publish the conformance report
        run: |
          pnpm run fable:app
          pnpm run conformance:report

      - name: Build showcase
        # The showcase's "open the playground" door targets the playground's
        # production origin (falls back to same-origin showcase.html when unset,
        # which is right for dev but wrong for the two-origin production split).
        run: pnpm run build:showcase
        env:
          VITE_PLAYGROUND_ORIGIN: https://fuaran-ui.live

      - name: Deploy
        # A push to main builds but does NOT publish — publication is deliberate
        # (workflow_dispatch). PR previews are intentionally UNAFFECTED: they are
        # ephemeral, scoped to the PR, and torn down by close_pull_request below.
        # (2026-07-26 — lets the repo be pushed freely without deploying.)
        if: github.event_name != 'push'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SHOWCASE }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # enables PR preview-URL comments
          action: upload
          # We already ran the build; just upload the produced dist-showcase/.
          app_location: fuaran-live/dist-showcase
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close pull-request preview environment
    steps:
      - name: Close
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SHOWCASE }}
          action: close
