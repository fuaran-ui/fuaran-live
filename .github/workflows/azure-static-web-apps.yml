name: Deploy to Azure Static Web Apps

# Builds the static dist/ and deploys it to Azure Static Web Apps (the static
# SKU — NO Functions / API tier; the app is fully client-only and the visitor
# supplies their own provider key at runtime, browser-direct).
#
# We build the app ourselves with pnpm (skip_app_build: true) rather than let
# Azure's Oryx builder run, because Oryx does not understand the strict-CSP
# Vite plugin. The SWA action then just uploads the already-built dist/.
#
# REQUIRED SECRET: AZURE_STATIC_WEB_APPS_API_TOKEN — the deployment token from
# the Azure Static Web App resource (Portal → the resource → Manage deployment
# token, or `az staticwebapp secrets list`).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: azure-swa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    # Skip on a closed PR (that path only tears down the preview environment).
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    defaults:
      run:
        working-directory: fuaran-live
    steps:
      - uses: actions/checkout@v4
        with:
          path: fuaran-live

      # Sibling checkouts (public repos, no token): the Fable app
      # project-references ../fuaran-dotnet; the corpus sits at ../wire-format-fixtures.
      - uses: actions/checkout@v4
        with:
          # Pinned to an exact ref: the F# tier is a PROJECT REFERENCE, so a
          # floating default branch let any upstream push redden this repo with no
          # commit here. A RELEASE TAG: v0.12.0 post-dates the Phases 692-694
          # flattened NodeKind this repo authors against, so the pin is back on a
          # tag (see ci.yml for why it was a bare SHA in between).
          # Rationale + bump procedure in ci.yml. The corpus checkout stays unpinned
          # deliberately — it is the shared conformance gate.
          repository: fuaran-ui/fuaran-dotnet
          # The PLAYGROUND project no longer project-references this repo at
          # all: it consumes the language tier as published nuget.org packages at
          # its own pin. So this checkout serves the SHOWCASE project alone, and
          # this ref decides which tier contracts that project compiles against —
          # a pin in every sense the package pins are, spelled as a git ref.
          #
          # It was a bare commit SHA from Phase 761 until this bump, for a reason
          # that has now expired: the showcase had adopted contracts postdating
          # every released tag, so no tag could compile it, and the note here said
          # to return to a tag once the tier cut a release carrying them. v0.70.0
          # is that release. It carries those contracts and the print-break,
          # node-tooltip and upload-sink members the showcase source now names.
          #
          # A tag is immutable, so this is no less deliberate than the SHA it
          # replaces. Bumping it is a SOURCE-AFFECTING act rather than a
          # housekeeping one: a tier release that widens a record breaks every
          # full-literal construction of it in app/showcase/, which is what the
          # move off the SHA cost here.
          #
          # To bump: raise the ref in all six workflows together (grep the ref).
          ref: v0.70.0
          path: fuaran-dotnet

      - uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-ui-specification
          path: wire-format-fixtures

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # NuGet hard-errors (NU1301) on the F# tier's missing local folder feed;
      # mint it empty — Fuaran.Core.* restores from nuget.org.
      - name: Create empty local-nuget-feed
        run: mkdir -p "$GITHUB_WORKSPACE/../../local-nuget-feed"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore .NET tools (Fable)
        run: dotnet tool restore

      - name: Build
        # The playground's door across to the demo gallery targets the showcase's
        # production origin (the playground artifact carries no showcase.html, so
        # the same-origin fallback would 404 on this two-origin split).
        run: pnpm build
        env:
          VITE_SHOWCASE_ORIGIN: https://fuaran-ui.gallery

      - name: Deploy
        # A push to main builds but does NOT publish — publication is deliberate
        # (workflow_dispatch). PR previews are intentionally UNAFFECTED: they are
        # ephemeral, scoped to the PR, and torn down by close_pull_request below.
        # (2026-07-26 — lets the repo be pushed freely without deploying.)
        if: github.event_name != 'push'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # enables PR preview-URL comments
          action: upload
          # We already ran the build; just upload the produced dist/.
          app_location: fuaran-live/dist
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close pull-request preview environment
    steps:
      - name: Close
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
