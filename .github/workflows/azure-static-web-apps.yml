name: Deploy to Azure Static Web Apps

# Builds the static dist/ and deploys it to Azure Static Web Apps (the static
# SKU — NO Functions / API tier; the app is fully client-only and the visitor
# supplies their own provider key at runtime, browser-direct).
#
# We build the app ourselves with pnpm (skip_app_build: true) rather than let
# Azure's Oryx builder run, because Oryx does not understand the strict-CSP
# Vite plugin. The SWA action then just uploads the already-built dist/.
#
# REQUIRED SECRET: AZURE_STATIC_WEB_APPS_API_TOKEN — the deployment token from
# the Azure Static Web App resource (Portal → the resource → Manage deployment
# token, or `az staticwebapp secrets list`).
#
# ── DEPLOY-CREDENTIAL POSTURE (Phase 1678) ───────────────────────────────────
#
# RECOMMENDED: keep the single stored token, and rotate it on a schedule.
# **Pending operator confirmation** — this is a deploy-surface decision, not a
# code fix, so it is recorded here with its trade stated rather than settled by
# whoever next edits the file.
#
# What is true today. Deployment authenticates with a long-lived deployment
# token held as a repository secret. There is ONE such token, and PR previews
# use it: the `build_and_deploy` job runs on `pull_request` and passes the same
# AZURE_STATIC_WEB_APPS_API_TOKEN that deploys production. That token is a
# bearer credential for the whole Static Web App resource — Azure SWA issues no
# preview-scoped token, so "give previews a scoped token" is not a setting to
# flip.
#
# What that does and does not expose. GitHub does not give secrets to a workflow
# run from a FORK, so an outside pull request cannot reach this token; the
# preview path is open to people who can already push a branch here, which is
# the same set who can push to main. The exposure the arrangement adds over
# production-only deploys is therefore narrow: a branch-pushing collaborator can
# read the token out of a run they trigger, and a compromised action in the
# build job would see it on a PR as well as on a push. The SHA pin on the deploy
# action and the read-only `permissions:` block are the mitigations already
# here.
#
# Why the recommendation is to keep previews rather than remove them. A preview
# environment per PR is what makes a client-only, CSP-strict app reviewable at
# all: the strict-CSP plugin means "it built" and "it loads" are different
# claims, and the preview is where the second is checked. Dropping previews to
# narrow an exposure that fork PRs already cannot reach would trade a real daily
# verification for very little.
#
# What rotation buys, and why it is the actual remedy. The token's weakness is
# its LIFETIME, not its blast radius: it stays the same string until somebody
# regenerates it, so a leak out of any historical run stays live indefinitely.
# Rotating it (Portal -> Manage deployment token -> Reset, then update the
# secret) bounds that window, and is one operator act rather than a workflow
# redesign.
#
# The alternative, recorded so it need not be rediscovered: replace the stored
# token with Azure OIDC federated credentials (`azure/login` plus a federated
# identity scoped to the resource), removing the long-lived secret entirely. The
# SWA deploy action's token input is not OIDC-aware, so that means deploying by
# CLI instead of by this action, and re-establishing the PR preview-URL comment
# path by hand. Real work, and worth pricing on its own.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: azure-swa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    # Skip on a closed PR (that path only tears down the preview environment).
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    defaults:
      run:
        working-directory: fuaran-live
    steps:
      - uses: actions/checkout@v4
        with:
          path: fuaran-live

      # Sibling checkouts (public repos, no token): the Fable app
      # project-references ../fuaran-dotnet; the corpus sits at ../wire-format-fixtures.
      - uses: actions/checkout@v4
        with:
          # The language-tier pin. Only the SHOWCASE project checks this tier out
          # (the playground consumes published packages), so this ref decides which
          # tier contracts app/showcase/ compiles against. Bumping it is a
          # SOURCE-AFFECTING act, not housekeeping, and it moves in all six
          # workflows together with the showcase migration in the same commit.
          # Rationale, procedure and the per-release history: docs/tier-pin.md.
          # The corpus checkout stays unpinned deliberately — it is the shared
          # conformance gate.
          repository: fuaran-ui/fuaran-dotnet
          ref: v0.80.0
          path: fuaran-dotnet

      - uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-ui-specification
          path: wire-format-fixtures

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # NuGet hard-errors (NU1301) on the F# tier's missing local folder feed;
      # mint it empty — Fuaran.Core.* restores from nuget.org.
      - name: Create empty local-nuget-feed
        run: mkdir -p "$GITHUB_WORKSPACE/../../local-nuget-feed"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore .NET tools (Fable)
        run: dotnet tool restore

      - name: Build
        # The playground's door across to the demo gallery targets the showcase's
        # production origin (the playground artifact carries no showcase.html, so
        # the same-origin fallback would 404 on this two-origin split).
        run: pnpm build
        env:
          VITE_SHOWCASE_ORIGIN: https://fuaran-ui.gallery
          # Phase 450 — the legacy-host redirect is compiled in for main-branch
          # builds only (push + dispatch); a PR preview serves itself and gets none.
          # See vite.config.ts `legacyHostRedirectScript`.
          VITE_CANONICAL_ORIGIN: ${{ github.event_name != 'pull_request' && 'https://fuaran-ui.live' || '' }}

      - name: Deploy
        # A push to main builds but does NOT publish — publication is deliberate
        # (workflow_dispatch). PR previews are intentionally UNAFFECTED: they are
        # ephemeral, scoped to the PR, and torn down by close_pull_request below.
        # (2026-07-26 — lets the repo be pushed freely without deploying.)
        if: github.event_name != 'push'
        # SHA-PINNED, not tag-pinned. This action receives the deployment API
        # token, so a moved tag is a credential-bearing code change nobody
        # reviewed. `# v1` records which release the digest is.
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # enables PR preview-URL comments
          action: upload
          # We already ran the build; just upload the produced dist/.
          app_location: fuaran-live/dist
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close pull-request preview environment
    steps:
      - name: Close
        # SHA-PINNED, not tag-pinned. This action receives the deployment API
        # token, so a moved tag is a credential-bearing code change nobody
        # reviewed. `# v1` records which release the digest is.
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
