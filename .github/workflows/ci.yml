name: CI

# The @fuaran-ui/* packages resolve from the public npm registry; the committed
# pnpm-lock.yaml is authoritative (installs are --frozen-lockfile). The F#/Fable
# app project-references the sibling F# tier, and the conformance gate reads the
# shared wire-format corpus, so both public repos are checked out as siblings.
# Local verification: clone fuaran-dotnet as ../fuaran-dotnet and fuaran-ui-specification
# as ../wire-format-fixtures, then `pnpm install && pnpm run build && pnpm test`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege, stated rather than inherited. This workflow reads the tree and
# writes nothing back — no package publish, no deployment, no PR comment.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuaran-live
    steps:
      - uses: actions/checkout@v4
        with:
          path: fuaran-live

      # Sibling checkouts (both repos are public — no token needed): the Fable
      # app project-references ../fuaran-dotnet; the conformance gate reads
      # ../wire-format-fixtures.
      #
      # The two are deliberately pinned DIFFERENTLY, and that asymmetry is the
      # point: the tier is consumed by project reference, so its source is part
      # of this app's compile and floating it lets an upstream push redden this
      # repo with no commit here (it did, on 2026-07-27); the corpus is the
      # shared conformance gate every host certifies against, and pinning it
      # would reintroduce exactly the drift that giving it one home bought out.
      #
      # Full rationale, the bump procedure, and why a tag was NOT automatically
      # the more rigorous choice here: docs/tier-pin.md.
      - uses: actions/checkout@v4
        with:
          # The language-tier pin. Only the SHOWCASE project checks this tier out
          # (the playground consumes published packages), so this ref decides which
          # tier contracts app/showcase/ compiles against. Bumping it is a
          # SOURCE-AFFECTING act, not housekeeping, and it moves in all six
          # workflows together with the showcase migration in the same commit.
          # Rationale, procedure and the per-release history: docs/tier-pin.md.
          # The corpus checkout stays unpinned deliberately — it is the shared
          # conformance gate.
          repository: fuaran-ui/fuaran-dotnet
          ref: v0.80.0
          path: fuaran-dotnet

      - uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-ui-specification
          path: wire-format-fixtures
          # Full history, because the host-pin drift step below measures the DISTANCE
          # between each pinned host's publish date and the corpus fixture commits that
          # followed it. The default depth of 1 holds HEAD and nothing else, under which
          # that distance is unmeasurable — the check would report "unknown" on every run
          # and the number it exists to give would never appear.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── The corpus-drift sentinel (Phase 1669, on Phase 1583's pattern) ─────
      #
      # Non-blocking, on every push: which pinned host predates a corpus fixture
      # commit. This repo bundles no corpus snapshot — what it pins is HOSTS, while
      # the conformance gate reads the corpus UNPINNED at whatever HEAD is, so the
      # drift that bites here is a pinned host that cannot know about a corpus move.
      # It bit twice on 2026-09-07 (`Chart.stacked`, then `Tabs.activeIndex`) and both
      # times the first symptom was a HALTED DEPLOY, because the showcase deploy stops
      # on a red conformance gate by design. This step is so the next one arrives as a
      # named warning on an ordinary push instead.
      #
      # It is a WARN and not a gate for the reason 1583's sentinel is: the measure is a
      # sound UPPER BOUND (a corpus commit newer than a release cannot be reflected in
      # it) and not a verdict, since most corpus commits move no encoding a given host
      # emits. Reddening `main` for a corpus typo would train people to ignore it. What
      # decides is the conformance arms, which run further down this same job.
      #
      # Runs BEFORE the install, build and Fable legs, so the warning is on the log
      # before ten minutes of work rather than after. Needs no install: node's stdlib
      # plus two registry lookups, and a network fault reports UNVERIFIED rather than a
      # clean bill.
      - name: Host-pin corpus drift (reported, non-blocking)
        continue-on-error: true
        run: |
          set +e
          node scripts/host-pin-drift.mjs 2>&1 | tee host-pin-drift.log
          status=${PIPESTATUS[0]}
          {
            echo "### Pinned hosts vs the corpus"
            echo
            echo '```'
            cat host-pin-drift.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # The projection-conformance gate compiles the F#/Fable projector, so the
      # .NET SDK is required (the rest of the repo is F#/Fable-built too).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The conformance gate's PYTHON arm executes its projected source against
      # the real fuaran-py host. Pinned to an exact published version: the arm's
      # quarantine names the constructs that release does not model, so a
      # floating version would move the set it describes with no commit here.
      # The pin and the runner must agree on requires-python: 0.0.1 declares
      # >=3.13 and so was UNSATISFIABLE on this 3.12 runner — pip failed at
      # install, which failed the whole job before any test ran. 0.0.3 and every
      # later release declare >=3.12 (0.3.0 pinned 2026-09-07: it models the
      # Drawing / Fact / Mount node kinds, the Query and Invoke bindings, the
      # Call / AiTool / Invoke actions and TextSource.I18n — twenty-eight
      # quarantined ids clear on the raise, twelve of them on the pin alone and
      # sixteen once app/Projection.fs is taught the construct).
      # Move the runner and the pin together, never one alone.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Python host (fuaran-py)
        run: python -m pip install --disable-pip-version-check fuaran-py==0.5.0

      # The F# tier's nuget.config declares a local folder feed at a fixed
      # relative depth; NuGet hard-errors (NU1301) on a missing folder source,
      # so mint it empty — Fuaran.Core.* restores from nuget.org.
      - name: Create empty local-nuget-feed
        run: mkdir -p "$GITHUB_WORKSPACE/../../local-nuget-feed"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Several test suites consume Fable-compiled output (the app projector at
      # app/output/, the query-portal bridge at fable-host/output/), so both
      # Fable projects compile before the test steps run.
      - name: Compile the Fable projects
        run: |
          dotnet tool restore
          pnpm run fable:app
          pnpm run fable

      # `pnpm test` chains the unit suite AND the conformance suite (the local
      # one-command gate). CI runs the unit leg alone here because the
      # conformance leg runs once below through the publisher — running the
      # full corpus suite twice per build buys nothing.
      - name: Test (unit suite)
        run: pnpm run test:unit

      # The multi-language source projector (app/Projection.fs) is kept honest by
      # the codegen-conformance harness: for every Node fixture in the shared
      # wire-format corpus it projects the wire JSON to @fuaran-ui/ui source,
      # executes it against the real packages, and asserts the re-encode is
      # byte-identical. Runs its own vitest config, so it is a distinct gate from
      # the main `Test` step above.
      # Run it through the publisher rather than bare `pnpm conformance`: the
      # suite and the exit status are identical, and it additionally exercises
      # scripts/conformance-report.mjs, the step the showcase deploy depends on
      # to publish public/conformance/report.generated.json. A publisher that
      # breaks should fail here, not at deploy time.
      - name: Conformance (projection ↔ wire-format corpus)
        env:
          FUARAN_PY_PYTHON: python
        run: pnpm run conformance:report

      - name: Build
        run: pnpm build

      # Phase 1628 — the render-latency harness, run in a real browser.
      #
      # It is a PROBE CHECK, not a latency gate. It asserts that the instrument
      # works — every declared metric finite and positive, full-render never
      # below time-to-commit, and the numbers scaling with tree size, so a
      # harness that had started timing something other than the tree it was
      # handed fails here. It asserts NO threshold in milliseconds: a wall-clock
      # bound on a shared hosted runner fails for reasons that have nothing to
      # do with the code, which is the same reason the two `render.*` latency
      # axes are deliberately unbudgeted in the consuming performance gate (the
      # measured run-to-run spread is in app/measure/README.md).
      #
      # `pnpm run measure` builds the measure page into its own dist-measure/
      # under VITE_MEASURE=1 — the shipped artifact above is untouched by it —
      # and then drives measure.html through Playwright.
      - name: Install the Playwright browser (render-latency capture)
        run: pnpm exec playwright install --with-deps chromium

      - name: Render-latency harness (capture + probe)
        run: pnpm run measure
