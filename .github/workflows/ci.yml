name: CI

# The @fuaran-ui/* packages resolve from the public npm registry; the committed
# pnpm-lock.yaml is authoritative (installs are --frozen-lockfile). The F#/Fable
# app project-references the sibling F# tier, and the conformance gate reads the
# shared wire-format corpus, so both public repos are checked out as siblings.
# Local verification: clone fuaran-dotnet as ../fuaran-dotnet and fuaran-ui-specification
# as ../wire-format-fixtures, then `pnpm install && pnpm run build && pnpm test`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuaran-live
    steps:
      - uses: actions/checkout@v4
        with:
          path: fuaran-live

      # Sibling checkouts (both repos are public — no token needed): the Fable
      # app project-references ../fuaran-dotnet; the conformance gate reads
      # ../wire-format-fixtures.
      #
      # fuaran-dotnet is PINNED to a release tag, and the two siblings are
      # deliberately pinned differently:
      #
      #   - The F# tier is consumed by PROJECT REFERENCE, so its source is part
      #     of this app's compile. Floating on its default branch meant any
      #     upstream push could redden this repo with no commit here — which is
      #     what happened on 2026-07-27, when Phase 330 added a required
      #     RenderContext field and all six workflows failed on a CI-only
      #     commit. A tag turns that into a deliberate bump: raise the ref, fix
      #     what the new contract needs, land it in one reviewed change.
      #   - The corpus stays UNPINNED on purpose. It is the shared conformance
      #     gate every host certifies against, and the whole point of giving it
      #     one home is that all hosts see the same current spec. Pinning it
      #     would reintroduce exactly the drift that split bought out.
      #
      # To bump: raise the ref in all six workflows together (grep the tag).
      - uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-dotnet
          ref: v0.6.0
          path: fuaran-dotnet

      - uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-ui-specification
          path: wire-format-fixtures

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The projection-conformance gate compiles the F#/Fable projector, so the
      # .NET SDK is required (the rest of the repo is F#/Fable-built too).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The F# tier's nuget.config declares a local folder feed at a fixed
      # relative depth; NuGet hard-errors (NU1301) on a missing folder source,
      # so mint it empty — Fuaran.Core.* restores from nuget.org.
      - name: Create empty local-nuget-feed
        run: mkdir -p "$GITHUB_WORKSPACE/../../local-nuget-feed"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Several test suites consume Fable-compiled output (the app projector at
      # app/output/, the query-portal bridge at fable-host/output/), so both
      # Fable projects compile before the test steps run.
      - name: Compile the Fable projects
        run: |
          dotnet tool restore
          pnpm run fable:app
          pnpm run fable

      - name: Test
        run: pnpm test

      # The multi-language source projector (app/Projection.fs) is kept honest by
      # the codegen-conformance harness: for every Node fixture in the shared
      # wire-format corpus it projects the wire JSON to @fuaran-ui/ui source,
      # executes it against the real packages, and asserts the re-encode is
      # byte-identical. Runs its own vitest config, so it is a distinct gate from
      # the main `Test` step above.
      # Run it through the publisher rather than bare `pnpm conformance`: the
      # suite and the exit status are identical, and it additionally exercises
      # scripts/conformance-report.mjs, the step the showcase deploy depends on
      # to publish public/conformance/report.generated.json. A publisher that
      # breaks should fail here, not at deploy time.
      - name: Conformance (projection ↔ wire-format corpus)
        run: pnpm run conformance:report

      - name: Build
        run: pnpm build
