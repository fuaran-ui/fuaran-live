name: CI

# The @fuaran-ui/* packages resolve from the public npm registry; the committed
# pnpm-lock.yaml is authoritative (installs are --frozen-lockfile). The F#/Fable
# app project-references the sibling F# tier, and the conformance gate reads the
# shared wire-format corpus, so both public repos are checked out as siblings.
# Local verification: clone fuaran-dotnet as ../fuaran-dotnet and fuaran-ui-specification
# as ../wire-format-fixtures, then `pnpm install && pnpm run build && pnpm test`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuaran-live
    steps:
      - uses: actions/checkout@v4
        with:
          path: fuaran-live

      # Sibling checkouts (both repos are public — no token needed): the Fable
      # app project-references ../fuaran-dotnet; the conformance gate reads
      # ../wire-format-fixtures.
      #
      # fuaran-dotnet is PINNED to an exact ref, and the two siblings are
      # deliberately pinned differently:
      #
      #   - The F# tier is consumed by PROJECT REFERENCE, so its source is part
      #     of this app's compile. Floating on its default branch meant any
      #     upstream push could redden this repo with no commit here — which is
      #     what happened on 2026-07-27, when Phase 330 added a required
      #     RenderContext field and all six workflows failed on a CI-only
      #     commit. An exact ref turns that into a deliberate bump: raise the
      #     ref, fix what the new contract needs, land it in one reviewed
      #     change.
      #   - The corpus stays UNPINNED on purpose. It is the shared conformance
      #     gate every host certifies against, and the whole point of giving it
      #     one home is that all hosts see the same current spec. Pinning it
      #     would reintroduce exactly the drift that split bought out.
      #
      # The ref is a RELEASE TAG again, which is where this pin was always
      # meant to end up. The history is worth keeping, because it explains why
      # a tag is not automatically the more rigorous choice:
      #
      #   Phases 692-694 flattened NodeKind and reshaped the authoring surface
      #   (TextSource, NodeId, SemanticStyle, SelectOption). This repo adopted
      #   that contract while no release tag carried it — v0.6.0 was the newest
      #   and PREDATED the change — so a tag pin named a contract the source no
      #   longer targeted, and every workflow compiled the migrated app against
      #   the old types. The pin moved to a commit SHA, which is at least as
      #   deliberate as a tag (a tag can be moved; a SHA cannot), on the stated
      #   intent of returning to a tag once the tier cut a release carrying the
      #   flattened NodeKind.
      #
      # That release exists, so this is that return. v0.12.0 post-dates the
      # flattening and its tree is one test-only commit ahead of the SHA the
      # pin previously named (which was the 0.12.0 version-bump commit, not the
      # tagged one) — so the contract this repo compiles against is unchanged
      # by the switch.
      #
      # To bump: raise the ref in all six workflows together (grep the ref).
      - uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-dotnet
          # The PLAYGROUND project no longer project-references this repo at
          # all: it consumes the language tier as published nuget.org packages at
          # its own pin. So this checkout serves the SHOWCASE project alone, and
          # this ref decides which tier contracts that project compiles against —
          # a pin in every sense the package pins are, spelled as a git ref.
          #
          # It was a bare commit SHA from Phase 761 until this bump, for a reason
          # that has now expired: the showcase had adopted contracts postdating
          # every released tag, so no tag could compile it, and the note here said
          # to return to a tag once the tier cut a release carrying them. v0.70.0
          # is that release. It carries those contracts and the print-break,
          # node-tooltip and upload-sink members the showcase source now names.
          #
          # A tag is immutable, so this is no less deliberate than the SHA it
          # replaces. Bumping it is a SOURCE-AFFECTING act rather than a
          # housekeeping one: a tier release that widens a record breaks every
          # full-literal construction of it in app/showcase/, which is what the
          # move off the SHA cost here.
          #
          # To bump: raise the ref in all six workflows together (grep the ref).
          ref: v0.70.0
          path: fuaran-dotnet

      - uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-ui-specification
          path: wire-format-fixtures

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The projection-conformance gate compiles the F#/Fable projector, so the
      # .NET SDK is required (the rest of the repo is F#/Fable-built too).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The conformance gate's PYTHON arm executes its projected source against
      # the real fuaran-py host. Pinned to an exact published version: the arm's
      # quarantine names the constructs that release does not model, so a
      # floating version would move the set it describes with no commit here.
      # The pin and the runner must agree on requires-python: 0.0.1 declares
      # >=3.13 and so was UNSATISFIABLE on this 3.12 runner — pip failed at
      # install, which failed the whole job before any test ran. 0.0.3 declares
      # >=3.12. Move the runner and the pin together, never one alone.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Python host (fuaran-py)
        run: python -m pip install --disable-pip-version-check fuaran-py==0.0.3

      # The F# tier's nuget.config declares a local folder feed at a fixed
      # relative depth; NuGet hard-errors (NU1301) on a missing folder source,
      # so mint it empty — Fuaran.Core.* restores from nuget.org.
      - name: Create empty local-nuget-feed
        run: mkdir -p "$GITHUB_WORKSPACE/../../local-nuget-feed"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Several test suites consume Fable-compiled output (the app projector at
      # app/output/, the query-portal bridge at fable-host/output/), so both
      # Fable projects compile before the test steps run.
      - name: Compile the Fable projects
        run: |
          dotnet tool restore
          pnpm run fable:app
          pnpm run fable

      # `pnpm test` chains the unit suite AND the conformance suite (the local
      # one-command gate). CI runs the unit leg alone here because the
      # conformance leg runs once below through the publisher — running the
      # full corpus suite twice per build buys nothing.
      - name: Test (unit suite)
        run: pnpm run test:unit

      # The multi-language source projector (app/Projection.fs) is kept honest by
      # the codegen-conformance harness: for every Node fixture in the shared
      # wire-format corpus it projects the wire JSON to @fuaran-ui/ui source,
      # executes it against the real packages, and asserts the re-encode is
      # byte-identical. Runs its own vitest config, so it is a distinct gate from
      # the main `Test` step above.
      # Run it through the publisher rather than bare `pnpm conformance`: the
      # suite and the exit status are identical, and it additionally exercises
      # scripts/conformance-report.mjs, the step the showcase deploy depends on
      # to publish public/conformance/report.generated.json. A publisher that
      # breaks should fail here, not at deploy time.
      - name: Conformance (projection ↔ wire-format corpus)
        env:
          FUARAN_PY_PYTHON: python
        run: pnpm run conformance:report

      - name: Build
        run: pnpm build
