name: Projection conformance

# The codegen-conformance gate for the source-projection Output box. For every
# Node fixture in the workspace wire-format-fixtures/ corpus, the TypeScript
# projection (app/Projection.fs, Fable-compiled) must execute against the real
# @fuaran-ui/ui surface and re-encode byte-identically to the wire fixture.
# Any drift FAILS THE BUILD — this is the validation engine that keeps the
# verified TypeScript AND Python projections honest (see docs/PROJECTION_FIDELITY.md;
# the F# / C# / VB legs are demo-grade pending their re-authored arms).
#
# This gate assembles a multi-repo layout because the Fable app build
# project-references the sibling F# tier (the @fuaran-ui/* npm packages
# themselves resolve from the registry). Every checked-out repo is public —
# no token needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      # Assemble the workspace layout:
      #   <root>/wire-format-fixtures   (fuaran-ui-specification)
      #   <root>/fuaran                 (F# tier — F# arm project reference)
      #   <root>/fuaran-live            (this repo)
      - name: Checkout the wire-format corpus (fuaran-ui-specification)
        uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-ui-specification
          path: workspace/wire-format-fixtures

      - name: Checkout fuaran (F# tier)
        uses: actions/checkout@v4
        with:
          # Pinned to an exact ref: the F# tier is a PROJECT REFERENCE, so a
          # floating default branch let any upstream push redden this repo with no
          # commit here. A RELEASE TAG: v0.12.0 post-dates the Phases 692-694
          # flattened NodeKind this repo authors against, so the pin is back on a
          # tag (see ci.yml for why it was a bare SHA in between).
          # Rationale + bump procedure in ci.yml. The corpus checkout stays unpinned
          # deliberately — it is the shared conformance gate.
          repository: fuaran-ui/fuaran-dotnet
          # The PLAYGROUND project no longer project-references this repo at
          # all: it consumes the language tier as published nuget.org packages at
          # its own pin. So this checkout serves the SHOWCASE project alone, and
          # this ref decides which tier contracts that project compiles against —
          # a pin in every sense the package pins are, spelled as a git ref.
          #
          # It was a bare commit SHA from Phase 761 until this bump, for a reason
          # that has now expired: the showcase had adopted contracts postdating
          # every released tag, so no tag could compile it, and the note here said
          # to return to a tag once the tier cut a release carrying them. v0.70.0
          # is that release. It carries those contracts and the print-break,
          # node-tooltip and upload-sink members the showcase source now names.
          #
          # A tag is immutable, so this is no less deliberate than the SHA it
          # replaces. Bumping it is a SOURCE-AFFECTING act rather than a
          # housekeeping one: a tier release that widens a record breaks every
          # full-literal construction of it in app/showcase/, which is what the
          # move off the SHA cost here.
          #
          # To bump: raise the ref in all six workflows together (grep the ref).
          ref: v0.70.0
          path: workspace/fuaran-dotnet

      - name: Checkout fuaran-live (this repo)
        uses: actions/checkout@v4
        with:
          path: workspace/fuaran-live

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup .NET (F# arm)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The PYTHON arm executes its projected source against the real fuaran-py
      # host. Pinned to an exact published version for the reason the TS arm's
      # note records about the npm pins: the arm's quarantine names the
      # constructs that release does not model, so a floating version would move
      # the set the quarantine describes without any commit here.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Python host (fuaran-py)
        run: python -m pip install --disable-pip-version-check fuaran-py==0.0.1

      # NuGet hard-errors (NU1301) on the F# tier's missing local folder feed;
      # mint it empty — Fuaran.Core.* restores from nuget.org.
      - name: Create empty local-nuget-feed
        run: mkdir -p "$GITHUB_WORKSPACE/../local-nuget-feed"

      - name: Install fuaran-live
        working-directory: workspace/fuaran-live
        run: pnpm install --frozen-lockfile

      # The harness consumes the Fable-compiled projector (app/output/).
      - name: Build the F#/Fable app
        working-directory: workspace/fuaran-live
        run: |
          dotnet tool restore
          pnpm run fable:app

      # Runs both arms: project every Node fixture, execute the generated source
      # against @fuaran-ui/ui (TS) and fuaran_py.ui (Python), byte-compare the
      # canonical re-encode. FUARAN_PY_PYTHON points the Python arm at the
      # interpreter setup-python provisioned — there is no repo-local .venv here.
      - name: Conformance gate
        working-directory: workspace/fuaran-live
        env:
          FUARAN_PY_PYTHON: python
        run: pnpm conformance
