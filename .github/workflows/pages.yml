name: Deploy to GitHub Pages

# Builds the static dist/ and publishes it to GitHub Pages. The app is fully
# static — no server, no secrets; the visitor supplies their own provider key
# at runtime, client-side only. The F#/Fable app takes the language tier as
# published packages and inlines its prompt pack from the tier's source, so the
# public fuaran-dotnet + fuaran-ui-specification repos are checked out as
# siblings (see ci.yml).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuaran-live
    steps:
      - uses: actions/checkout@v4
        with:
          path: fuaran-live
      - uses: actions/checkout@v4
        with:
          # The language-tier pin. No project compiles this checkout: every F#
          # project takes the tier as published packages (the showcase since
          # Phase 2140). The one input read from it is the playground's prompt pack
          # (the ?raw import in app/SystemPrompt.fs) — the teaching for the tier the
          # playground compiles — so test/restoreGraphPublic.test.ts holds this ref
          # equal to v$(FuaranUIVersion), and it moves with every raise, in the four
          # workflows that build the playground. Rationale and history:
          # docs/tier-pin.md. The corpus checkout stays unpinned deliberately — it is
          # the shared conformance gate.
          repository: fuaran-ui/fuaran-dotnet
          ref: v0.96.0
          path: fuaran-dotnet
      - uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-ui-specification
          path: wire-format-fixtures
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # NuGet hard-errors (NU1301) on the F# tier's missing local folder feed;
      # mint it empty — Fuaran.Core.* restores from nuget.org.
      - name: Create empty local-nuget-feed
        run: mkdir -p "$GITHUB_WORKSPACE/../../local-nuget-feed"
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore .NET tools (Fable)
        run: dotnet tool restore
      - name: Build
        # Playground artifact — its demo-gallery door targets the showcase's
        # production origin (same reasoning as azure-static-web-apps.yml).
        run: pnpm build
        env:
          VITE_SHOWCASE_ORIGIN: https://fuaran-ui.gallery
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fuaran-live/dist

  deploy:
    needs: build
    # A push builds and uploads the artifact but does NOT publish: publication is
    # a deliberate act, run via "Run workflow". Same posture as
    # fuaran-dotnet/catalog-pages.yml, so the estate has one rule rather than
    # three. (2026-07-26 — lets the repo be pushed freely without deploying.)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
