<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--CSP-INJECTION-POINT-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="fuaran-live – serverless, client-only BYOK playground for the Fuaran UI language, built entirely in Fuaran itself (F#/Fable). No account, no server."
    />
    <title>Fuaran UI Live</title>
    <!-- Canonical URL + social card (Phase 450). The origin is the custom domain,
         never the host's default hostname; the card is a static 1200x630 PNG under
         public/brand and is referenced absolutely because crawlers fetch it off-site. -->
    <link rel="canonical" href="https://fuaran-ui.live/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fuaran UI" />
    <meta property="og:title" content="Fuaran UI Live" />
    <meta
      property="og:description"
      content="fuaran-live – serverless, client-only BYOK playground for the Fuaran UI language, built entirely in Fuaran itself (F#/Fable). No account, no server."
    />
    <meta property="og:url" content="https://fuaran-ui.live/" />
    <meta property="og:image" content="https://fuaran-ui.live/brand/og-fuaran-ui-live.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fuaran UI Live" />
    <meta
      name="twitter:description"
      content="fuaran-live – serverless, client-only BYOK playground for the Fuaran UI language, built entirely in Fuaran itself (F#/Fable). No account, no server."
    />
    <meta name="twitter:image" content="https://fuaran-ui.live/brand/og-fuaran-ui-live.png" />
    <!--LEGACY-HOST-REDIRECT-INJECTION-POINT-->
    <link rel="icon" type="image/svg+xml" href="brand/fuaran-favicon.svg" />
    <!-- Pre-paint theme resolution: persisted choice -> OS preference. Sets the
         .ds-dark chrome class before first paint so a dark-preference load never
         flashes light. The Elmish toggle keeps ownership after boot. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('fuaran-theme');
          var dark =
            t === 'dark' ||
            (t !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('ds-dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- The entirely-F#/Fable app mounts here. The whole playground is a Fuaran
         app rendered through the F# Fuaran.UI.Renderer – no TypeScript shell. -->
    <div id="fuaran-live-fs-root"></div>
    <script type="module" src="/app/output/App.js"></script>
  </body>
</html>
