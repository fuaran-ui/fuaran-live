    <!--
      Phase 1628 — the render-latency measurement page. NOT part of the shipped
      site: it is emitted only under `VITE_MEASURE=1`, into `dist-measure/`, and
      the deploy workflows never set that flag.

      Two mount points, and the split is load-bearing. The theme's CSS custom
      properties are mounted once into #fuaran-measure-theme, outside every
      timed region; the timed trees mount into fresh containers under
      #fuaran-measure-root, which carries the `fuaran-root` class the reference
      stylesheet keys its cascade off.
    -->
    <div id="fuaran-measure-theme"></div>
    <div id="fuaran-measure-root" class="fuaran-root"></div>
    <script type="module" src="/app/output/measure/Capture.js"></script>
